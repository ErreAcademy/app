/* botón atrás (móvil y PC): navegar hacia atrás dentro de la app en vez de salir */
let _nvLast=null,_nvBusy=false;
function nvSnap(){try{if(typeof PROFILE==='undefined'||!PROFILE)return null;const sh=document.getElementById('sheet');const so=!!(sh&&sh.classList.contains('on'));
  if(PROFILE.role==='coach')return {r:1,sec:CP.sec,v:CP.view,cid:CP.cid||null,tab:CP.tab||null,rt:(typeof RT!=='undefined'&&RT.open)?1:0,sh:so};
  return {r:0,t:S.tab,p:S.profile||false,c:!!S.chatOpen,g:S.tg||null,s:(S.prog&&S.prog.seg)||null,sh:so};}catch(e){return null;}}
const nvSig=s=>JSON.stringify(s);
let _nvAct=false;['click','touchend','keydown'].forEach(ev=>document.addEventListener(ev,()=>{_nvAct=true;},{capture:true,passive:true}));
function nvSync(){if(_nvBusy||!_nvAct)return;const s=nvSnap();if(!s)return;const sg=nvSig(s);
  if(_nvLast===null){_nvLast=sg;try{history.replaceState({erre:1,guard:1},'');history.pushState({erre:1,snap:s},'');}catch(e){}return;}
  if(sg!==_nvLast){_nvLast=sg;try{history.pushState({erre:1,snap:s},'');}catch(e){}}}
document.addEventListener('click',()=>setTimeout(nvSync,80),true);setInterval(nvSync,500);
let _nvArm=false;
window.addEventListener('popstate',e=>{const st=e.state;if(st&&st.erre&&st.guard){const cs=nvSnap();if(!cs)return;try{history.pushState({erre:1,snap:cs},'');}catch(x){}_nvLast=nvSig(cs);
    if(_nvArm){_nvArm=false;sheet(`<h3>¿Salir de la app?</h3><div class="sub">Tu progreso está guardado.</div><button class="btn solid" data-act="nvstay" style="width:100%;margin-top:8px">Quedarme</button><button class="btn" data-act="nvexit" style="width:100%;margin-top:8px">Salir</button>`);}
    else{_nvArm=true;toast('Toca atrás otra vez para salir');setTimeout(()=>{_nvArm=false;},3000);}return;}
  if(!st||!st.erre||!st.snap)return;const s=st.snap,cur=nvSnap();if(!cur||cur.r!==s.r)return;_nvBusy=true;
  try{
    const sh=document.getElementById('sheet');if(sh&&sh.classList.contains('on')&&!s.sh)closeSheet();
    if(s.r===1){
      if(cur.rt&&!s.rt){const bk=document.querySelector('[data-act="rtback"]');if(bk){bk.click();}
        if(typeof RT!=='undefined'&&RT.open){history.pushState({erre:1,snap:cur},'');_nvBusy=false;return;}}
      CP.sec=s.sec||CP.sec;
      if(s.v==='client'&&s.cid&&CP.cid===s.cid&&CP.d){CP.view='client';CP.tab=s.tab||CP.tab;}else{CP.view='list';}
      if(CP.sec==='chat')cpInboxLoad();clearInterval(CP.poll);coachRender();
    }else{
      S.tab=s.t;S.profile=s.p;S.chatOpen=s.c;S.tg=s.g;if(s.s&&S.prog)S.prog.seg=s.s;save();render();
    }
  }catch(x){}
  setTimeout(()=>{_nvLast=nvSig(nvSnap());_nvBusy=false;},150);});

document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('[data-act="nvstay"],[data-act="nvexit"]');if(!t)return;e.stopPropagation();
  if(t.dataset.act==='nvstay'){closeSheet();return;}
  _nvBusy=true;closeSheet();try{history.go(-2);}catch(x){}setTimeout(()=>{_nvBusy=false;try{window.close();}catch(x){}},400);},true);

/* ---------- Fuerza: series diarias por grupo (con prioridad) e histórico por ejercicio ---------- */
const PGR=['Pecho','Espalda','Hombro','Brazos','Pierna','Glúteo','Core'];
const PRI={alta:{lo:4,hi:6,n:'Alta',c:'#C0392B'},media:{lo:2,hi:4,n:'Media',c:'#E08A2E'},baja:{lo:0,hi:2,n:'Baja',c:'#5B7FC7'}};
const prioOf=g=>{const v=S.prio&&S.prio[g];return PRI[v]?v:'media';};
const fzn=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
var FZ={g:'Todos',q:'',d:null};
function fzData(){
  const days={},ex={};
  Object.keys(S.logs||{}).forEach(k=>{const [date,did,bk,ii]=k.split('|');if(bk==='warm'||bk==='calm'||bk==='cardio')return;
    const sets=(S.logs[k]||[]).filter(x=>x&&x.done);if(!sets.length)return;
    const d=DAYS.find(x=>x.id===did)||(did==='free'&&typeof FREE!=='undefined'?FREE:null);if(!d)return;
    withDate(date,()=>{const b=d.blocks.find(x=>x.k===bk);if(!b)return;const it=itemsOf(d,b)[+ii];if(!it)return;
      const id=curEx(d,bk,+ii,it),e=E[id]||{};
      if(e.g&&PGR.includes(e.g)){const o=days[date]=days[date]||{};o[e.g]=(o[e.g]||0)+sets.length;}
      const w=sets.filter(x=>x.kg>0||x.reps).map(x=>({kg:+x.kg||0,reps:+x.reps||0}));
      if(w.length&&e.n){const a=ex[id]=ex[id]||[],f=a.find(r=>r.date===date);if(f)f.sets=f.sets.concat(w);else a.push({date,sets:w});}});});
  Object.values(ex).forEach(a=>a.sort((x,y)=>x.date<y.date?-1:1));
  return {days,ex};
}
const fzDate=d=>d===today()?'Hoy':cap(pd(d).toLocaleDateString('es-CO',{weekday:'short',day:'numeric'})).replace('.','');
function fzSeries(){
  const {days}=fzData(),dates=Object.keys(days).sort().reverse();
  if(!dates.length)return emptyCard('Aún no hay series registradas','Cuando marques series en Entrenar, aquí verás cuántas hiciste por grupo muscular.');
  const sel=FZ.d&&days[FZ.d]?FZ.d:dates[0],hasP=S.prio&&Object.keys(S.prio).length,coach=PROFILE&&PROFILE.role==='coach';
  const rows=Object.keys(days[sel]).sort((a,b)=>days[sel][b]-days[sel][a]).map(g=>{
    const n=days[sel][g],p=PRI[prioOf(g)],st=n<p.lo?'low':n>p.hi?'high':'ok',col=st==='ok'?'#2E9D6B':st==='low'?'#E08A2E':'#8A847B',mx=Math.max(8,n);
    const msg=st==='ok'?'En rango ✓':st==='low'?'Te faltaron '+(p.lo-n):'De más: '+(n-p.hi);
    return `<div class="fzr"><div class="fzh"><b>${g}</b>${hasP?`<span class="fzt" style="--c:${p.c}">${p.n}</span>`:''}<em>${n} serie${n>1?'s':''}</em></div>
     <div class="fzb"><u style="left:${p.lo/mx*100}%;width:${Math.max(.05,(p.hi-p.lo)/mx)*100}%"></u><i style="width:${n/mx*100}%;background:${col}"></i></div>
     <small style="color:${col}"><b>Objetivo ${p.lo}–${p.hi}</b> · ${msg}</small></div>`;}).join('');
  const chips=dates.slice(0,6).map(d=>`<button class="chip${d===sel?' on':''}" data-act="fzd" data-v="${d}">${fzDate(d)}</button>`).join('');
  const lb=(k,t)=>`<button class="fzt" style="--c:${PRI[k].c}" data-act="fzpri" data-v="${k}">${t} ⓘ</button>`;
  const leg=hasP?lb('alta','Alta 4–6')+lb('media','Media 2–4')+lb('baja','Baja 0–2'):lb('media','Referencia: 2–4 series por grupo');
  return `<h2 class="h2" style="margin-top:4px">Series por grupo</h2><div class="sub2" style="margin:0 0 8px">Series de trabajo de cada sesión contra el rango por prioridad.</div>
   <div class="chips" style="margin-bottom:8px">${chips}</div><div class="fzleg">${leg}</div>${rows}`;
}
function fzList(){
  const {ex}=fzData(),q=fzn(FZ.q).trim();
  let ids=Object.keys(ex).filter(id=>{const e=E[id]||{};if(FZ.g!=='Todos'&&e.g!==FZ.g)return false;
    return !q||fzn(e.n).includes(q)||fzn(e.mus||e.s).includes(q)||fzn(e.g).includes(q);});
  if(!ids.length)return `<div class="sub2" style="padding:10px 2px">No encontré ejercicios con ese filtro.</div>`;
  const last=id=>ex[id][ex[id].length-1],order=g=>{const i=PGR.indexOf(g);return i<0?99:i;};
  ids.sort((a,b)=>order(E[a].g)-order(E[b].g)||(last(b).date<last(a).date?-1:1));

function rtInput(e){
  const t=e.target;if(!t.dataset||!t.dataset.rt||!RT.open)return;const k=t.dataset.rt,v=t.value;RT.dirty=true;

  if(k==='blkname'){const bb=rtBlock(RT.days[RT.sel],t.dataset.bk);if(bb)bb.t=v.slice(0,40);return;}

  if(k==='dcirsel'){const c=(RT.cir||[]).find(x=>x.id===v);if(c){RT.days[RT.sel].circuit=Object.assign({},c.cfg,{dbid:c.id});RT.dirty=true;rtShow();}return;}
  if(k==='dfa'){if(v)RT.days[RT.sel].fa=v;else delete RT.days[RT.sel].fa;return;}

  if(k==='ex'){it.ex=v;rtShow();return;}
  if(k==='fsets'){it.fixed.sets=v;}else if(k==='freps'){it.fixed.reps=v;}
  else if(k==='ovs'||k==='ovr'){it.ov=it.ov||{};const f=k==='ovs'?'sets':'reps';if(v==='')delete it.ov[f];else it.ov[f]=f==='sets'?(+v||undefined):v;if(!Object.keys(it.ov).length)delete it.ov;}

  else if(k==='rest'){it.rest=+v||0;}
  else it[k]=v;
}

      <label class="pfl" style="margin-top:8px">Nivel</label><select class="fld" id="exL">${[1,2,3].map(n=>`<option value="${n}"${(e.lvl||1)===n?' selected':''}>${LVN[n]}</option>`).join('')}</select>
      <label class="pfl" style="margin-top:8px">Consejo del coach (opcional)</label><input class="fld" id="exT" value="${esc(e.tip||'')}">
      <div class="note" style="margin-top:10px"><b>Alternativas hoy (mismo patrón):</b> ${alts.length?alts.slice(0,12).map(([k,x])=>esc(x.n)).join(' · ')+(alts.length>12?' · +'+(alts.length-12)+' más':''):'ninguna todavía'}</div></details>
     <button class="btn solid" data-act="rtexsave" style="width:100%;margin-top:12px;padding:13px">Guardar</button><button class="btn" data-act="rtexcancel" style="width:100%;margin-top:8px">Cancelar</button>`);}
  else if(a==='rtexcancel'){closeSheet();}
  else if(a==='rtexsave'){const id=RT.ex,e=E[id],v=i=>(document.getElementById(i).value||'').trim();if(!v('exN')){toast('Escribe el nombre');return;}
    let yt=v('exY');const m=yt.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);yt=m?m[1]:(/^[A-Za-z0-9_-]{11}$/.test(yt)?yt:'');
    const data=Object.assign({},e,{n:v('exN'),g:v('exG'),pat:v('exP')||e.pat,mus:v('exM')||e.mus,eq:v('exE'),lvl:+v('exL')||1});if(RT.exSt){if(RT.exSt.tipos.length)data.tipos=RT.exSt.tipos.slice();else delete data.tipos;if(RT.exSt.tags.length)data.tags=RT.exSt.tags.slice();else delete data.tags;}if(yt)data.yt=yt;else delete data.yt; if(v('exI'))data.inst=v('exI');else delete data.inst;if(v('exT'))data.tip=v('exT');else delete data.tip;
    try{await DB.saveCustomEx(id,data,ME.id);E[id]=data;closeSheet();toast('Ejercicio actualizado ✓');rtShow&&RT.open?rtShow():coachRender();}catch(x){toast('No se pudo guardar');}}
  else if(a==='rtpendno'){if(RT.pk&&RT.pk.pend){RT.pk.pend=null;pkRender();}else{RT.pend=null;rtShow();}}
  else if(a==='rtpendok'){if(RT.pk&&RT.pk.pend){const P=RT.pk;rtPendAdd(P.di,P.bk,P.pend);P.pend=null;RT.dirty=true;closeSheet();rtShow();toast('Ejercicio añadido ✓');}
    else if(RT.pend){rtPendAdd(RT.sel,RT.lib.bk,RT.pend);RT.pend=null;RT.dirty=true;rtShow();toast('Ejercicio añadido ✓');}}
  else if(a==='rtpkx'){RT.pk=null;closeSheet();}
  else if(a==='rtpkg'){RT.pk.g=t.dataset.v;RT.pk.pat='';pkRender();}
  else if(a==='rtpkp'){RT.pk.pat=RT.pk.pat===t.dataset.v?'':t.dataset.v;pkRender();}
  else if(a==='rtpickex'){const P=RT.pk,id=t.dataset.id;
    if(P.mode==='replace'){RT.days[P.di].blocks.find(b=>b.k===P.bk).items[P.ii].ex=id;}
    else{P.pend={id};pkRender();return;}
    RT.dirty=true;closeSheet();rtShow();}
  else if(a==='rtdel'){const b=rtBlock(RT.days[di],bk);b.items.splice(ii,1);RT.dirty=true;rtShow();}
  else if(a==='rtmvb'){const b0=rtBlock(RT.days[di],bk),to=bk==='main'?'acc':'main',b1=rtBlock(RT.days[di],to);if(!b0||!b1)return;rtMoveItem(di,bk,ii,to,b1.items.length);toast(to==='main'?'Movido a Central':'Movido a Accesorios');}
  else if(a==='rtmove'){const b=rtBlock(RT.days[di],bk),j=ii+(+t.dataset.d);if(j<0||j>=b.items.length)return;const x=b.items.splice(ii,1)[0];b.items.splice(j,0,x);RT.dirty=true;rtShow();}
  else if(a==='rtsave'){
    if(!RT.name.trim()){RT.err='Ponle un nombre.';rtShow();return;}
    RT.busy=true;RT.err='';rtShow();
    try{
      if(RT.self){const nd=rtClone(RT.days[0]),n=RT.xtn;nd.name=RT.name.trim()||nd.name;let L=((S.ctasks&&S.ctasks.tasks)||[]).filter(x=>x.id!==n.id);const occ=!!ctxFor(n.date).d||L.some(x=>x.date===n.date&&x.type==='workout'&&!x.extra);const task={id:n.id,date:n.date,type:'workout',title:nd.name||'Mi entreno',day:nd,by:ME.id,self:1,at:new Date().toISOString()};if(occ)task.extra=true;L.push(task);S.ctasks={tasks:L};cxSync();save();RT.dirty=false;RT.busy=false;RT.xtn=null;RT.self=false;toast('Entreno guardado ✓');rtClose();render();window.scrollTo(0,0);return;}
      if(RT.xtn){const nd=rtClone(RT.days[0]),n=RT.xtn;nd.name=RT.name.trim()||nd.name;const task={id:n.id,date:n.date,type:'workout',title:nd.name||'Workout',day:nd,by:ME.id,at:new Date().toISOString()};
        let L=cxListOf(CP.d).slice();L.filter(x=>x.date===n.date&&(x.type==='rest'||x.type==='workout')).forEach(x=>{L=cxDropT(L,x.id);});L.push(task);await cpSaveTasks(L);
        RT.dirty=false;RT.busy=false;RT.xtn=null;toast('Workout asignado ✓ El cliente lo verá al abrir su app');rtClose();coachRender();cpDayOpen(n.date);return;}
      if(RT.xt){const nd=rtClone(RT.days[0]);await cpSaveTasks(cxListOf(CP.d).map(x=>x.id===RT.xt?Object.assign({},x,{day:nd,title:nd.name||x.title}):x));RT.dirty=false;RT.busy=false;RT.xt=null;toast('Workout actualizado ✓');rtClose();coachRender();return;}
      if(RT.kind==='client'){await DB.saveRoutine(RT.cid,RT.name.trim(),RT.days,ME.id);CP.routine={name:RT.name.trim(),days:rtClone(RT.days)};
        try{await DB.sendCoach(RT.cid,ME.id,'Actualicé tu rutina. Revísala en la pestaña Entrenar de tu app.');}catch(x){}}
      else{const r=await DB.saveTemplate(RT.id,RT.name.trim(),RT.days,ME.id,RT.tkind,RT.folder||null);RT.id=r&&r.id||RT.id;await rtLoadTpls();}
      draftClear();RT.dirty=false;RT.busy=false;toast(RT.kind==='client'?'Programa publicado ✓':'Plantilla guardada ✓');rtClose();if(RT.kind==='template')coachHome();else coachRender();
    }catch(x){console.warn(x);RT.busy=false;RT.err='No se pudo guardar. Intenta de nuevo.';rtShow();}}
  else if(a==='rtastpl'){const n=prompt('Nombre del programa',RT.name||'');if(!n)return;
    try{await DB.saveTemplate(null,n.trim(),RT.days,ME.id,'program',null);await rtLoadTpls();toast('Guardado en Programas ✓');}catch(x){RT.err='No se pudo guardar.';rtShow();}}

    try{await DB.saveTemplate(null,n.trim(),[rtClone(d)],ME.id,'workout',null);await rtLoadTpls();toast('Guardado en Workouts ✓');}catch(x){RT.err='No se pudo guardar.';rtShow();}}

  else if(a==='rtlbren'){const f=RT.fo.find(x=>x.id===t.dataset.id),n=prompt('Nuevo nombre',f&&f.name);if(!n||!n.trim())return;try{await DB.renameFolder(f.id,n.trim());await rtLoadTpls();coachRender();}catch(x){toast('No se pudo renombrar');}}
  else if(a==='rtlbdelf'){const id=t.dataset.id;if(RT.fo.some(x=>x.parent_id===id)||RT.tpls.some(x=>x.folder_id===id)){toast('Primero vacía la carpeta');return;}if(!confirm('¿Eliminar esta carpeta?'))return;try{await DB.delFolder(id);await rtLoadTpls();coachRender();}catch(x){toast('No se pudo eliminar');}}

/* ---------- cliente: cargar su rutina real ---------- */
async function loadClientRoutine(uid){
  await rtLoadCx();
  try{const r=await DB.routine(uid);if(r&&r.days&&r.days.length){DAYS.length=0;r.days.forEach(d=>DAYS.push(d));}cxSync();}catch(e){console.warn('routine',e);}
}

/* ---------- arrastrar ejercicios (entre Central y Accesorios, reordenar, y desde la biblioteca) ---------- */
function rtMoveItem(di,fb,fi,tb,ti){
  const d=RT.days[di],B0=rtBlock(d,fb),B1=rtBlock(d,tb);if(!B0||!B1||!B0.items[fi])return;
  const okb=k=>k==='main'||k==='acc'||String(k).indexOf('x_')===0,cross=fb!==tb;if(cross&&!(okb(fb)&&okb(tb)))return;
  const it=B0.items.splice(fi,1)[0];if(!cross&&fi<ti)ti--;
  if(cross){const toM=tb==='main';if(it.kind==='basic'||it.kind==='acc'){it.kind=toM?'basic':'acc';
    if(!it.tempo||it.tempo===(toM?RDEF.tempo:'3-0-1-0'))it.tempo=toM?'3-0-1-0':RDEF.tempo;
    if(!it.rest||+it.rest===(toM?RDEF.rest:120))it.rest=toM?120:RDEF.rest;}}
  B1.items.splice(Math.max(0,Math.min(ti,B1.items.length)),0,it);RT.dirty=true;rtShow();
}
RT.dr=null;RT.dl=null;RT.dt=null;
function rtDropClear(){document.querySelectorAll('.rtdrop,.rtbefore,.rtafter,.rtdragging').forEach(x=>x.classList.remove('rtdrop','rtbefore','rtafter','rtdragging'));}
document.addEventListener('dragstart',e=>{
  const g=e.target.closest&&e.target.closest('[data-rtdrag]'),l=e.target.closest&&e.target.closest('[data-libdrag]');
  if(g){const [di,bk,ii]=g.dataset.rtdrag.split('|');RT.dr={di:+di,bk,ii:+ii};RT.dl=null;try{e.dataTransfer.setData('text/plain','rt');e.dataTransfer.effectAllowed='move';const r=g.closest('.rtit');if(r){e.dataTransfer.setDragImage(r,24,24);r.classList.add('rtdragging');}}catch(x){}}
  else if(l){RT.dl=l.dataset.libdrag;RT.dr=null;try{e.dataTransfer.setData('text/plain','lib');e.dataTransfer.effectAllowed='copy';}catch(x){}}
},true);
document.addEventListener('dragover',e=>{
  if(!RT.dr&&!RT.dl)return;const sec=e.target.closest&&e.target.closest('.rtsec[data-dropbk]');if(!sec)return;
  const bk=sec.dataset.dropbk;
  if(RT.dr&&RT.dr.bk!==bk&&!((RT.dr.bk==='main'||RT.dr.bk==='acc')&&(bk==='main'||bk==='acc')))return;
  e.preventDefault();rtDropClear();sec.classList.add('rtdrop');
  const it=e.target.closest('.rtit');let idx=rtBlock(RT.days[RT.sel],bk).items.length;
  if(it){const [,,ii]=it.dataset.rtit.split('|'),r=it.getBoundingClientRect(),after=e.clientY>r.top+r.height/2;idx=+ii+(after?1:0);it.classList.add(after?'rtafter':'rtbefore');}
  RT.dt={bk,idx};
},true);
document.addEventListener('drop',e=>{
  if(!RT.dr&&!RT.dl)return;const sec=e.target.closest&&e.target.closest('.rtsec[data-dropbk]');if(!sec||!RT.dt){rtDropClear();return;}
  e.preventDefault();const {bk,idx}=RT.dt,di=RT.sel;
  if(RT.dr){const f=RT.dr;RT.dr=null;rtDropClear();rtMoveItem(f.di,f.bk,f.ii,bk,idx);}
  else if(RT.dl){const id=RT.dl;RT.dl=null;rtDropClear();rtAddItem(di,bk,id);const b=rtBlock(RT.days[di],bk);b.items.splice(idx,0,b.items.pop());RT.dirty=true;rtShow();}
  RT.dt=null;
},true);
document.addEventListener('dragend',()=>{RT.dr=null;RT.dl=null;RT.dt=null;rtDropClear();},true);

async function rtLoadCir(){RT.cir=null;try{const r=await DB.circuits();RT.cir=(r||[]).map(x=>({id:x.id,name:x.name,cfg:x.cfg}));}catch(e){console.warn('circuits',e);RT.cir=[];}rtShow();}

boot();

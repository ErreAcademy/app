<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERRE · App (prototipo)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap">
<style>
:root{
  --ink:#1C1B19; --gray:#5A554E; --bg:#F7F6F3; --paper:#EFEDE8; --card:#FBFAF8; --line:#DCD6CC;
  --red:#C0392B; --red-strong:#96271B; --red-tint:#F5E4E0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;font-weight:400}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:0 16px 120px}
h1,h2,h3,.title{font-family:'Archivo',sans-serif;font-stretch:125%;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin:0}
header.top{display:flex;align-items:center;gap:12px;padding:18px 0 10px}
header.top svg{width:48px;height:48px;flex:none}
header.top .who{flex:1;min-width:0}
header.top .who small{display:block;color:var(--gray);font-size:12px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--gray)}
.proto{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin:6px 0 14px;background:var(--paper);font-size:12px;color:var(--gray)}
.proto summary{cursor:pointer;font-weight:600}
.proto .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.proto label{display:flex;flex-direction:column;gap:3px;font-size:11px;flex:1;min-width:120px}
.proto select{padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.meso{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:4px 0 8px}
.meso .title{font-size:13px;color:var(--gray)}
.weeks{display:flex;gap:6px;margin-bottom:12px}
.weeks button{flex:1;padding:8px 0;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:13px}
.weeks button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.days{display:flex;gap:8px;margin-bottom:14px}
.days button{flex:1;text-align:left;padding:10px 12px;border:1px solid var(--line);background:var(--card);border-radius:12px}
.days button.on{border-color:var(--red);background:var(--red-tint)}
.days small{display:block;color:var(--gray);font-size:11px}
.days b{font-weight:600;font-size:14px}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:2px 0 16px}
.progress i{display:block;height:100%;background:var(--red);width:0;transition:width .25s}
.block{margin-bottom:12px}
.block>button.bh{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid var(--line);background:var(--paper);border-radius:12px;text-align:left}
.block .bh .title{font-size:13px}
.block .bh span{color:var(--gray);font-size:12px}
.block.open>button.bh{border-bottom-left-radius:0;border-bottom-right-radius:0}
.block .bb{display:none;border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;background:var(--card);padding:6px 12px 12px}
.block.open .bb{display:block}
.ex{padding:14px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.ex-head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.ex-name{font-weight:600;font-size:16px;line-height:1.25}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--gray);background:var(--bg)}
.tag.sub{background:var(--red-tint);border-color:#E7C4BD;color:var(--red-strong)}
.presc{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.presc button{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center}
.presc small{display:block;font-size:10px;color:var(--gray);text-transform:uppercase;letter-spacing:.06em}
.presc b{font-weight:600;font-size:13px;white-space:nowrap}
.sheet p{font-size:14px;line-height:1.5;margin:0 0 6px}
.ref{font-size:13px;margin:6px 0;color:var(--gray)}
.ref b{color:var(--ink)}
.note{font-size:13px;color:var(--gray);background:var(--paper);border-radius:8px;padding:8px 10px;margin:6px 0}
.note b{color:var(--ink);font-weight:600}
.actions{display:flex;gap:8px;margin:8px 0}
.btn{flex:1;padding:9px 10px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:13px;font-weight:500}
.btn.red{border-color:var(--red);color:var(--red-strong)}
.btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sets{margin-top:6px}
.setwrap{margin-bottom:10px}
.set{display:grid;grid-template-columns:24px 1fr 1fr 1fr 40px;gap:6px;align-items:center}
.set .n{font-weight:600;color:var(--gray);text-align:center}
.set input[type=number],.drop input[type=number]{width:100%;padding:9px 4px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:center}
.set button{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px}
.setwrap.done .set button{background:var(--red);border-color:var(--red);color:#fff}
.setwrap.done .set input{background:var(--red-tint)}
.setlabels{display:grid;grid-template-columns:24px 1fr 1fr 1fr 40px;gap:6px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--gray);text-align:center;margin-bottom:4px}
.lblbtn{background:none;border:0;padding:0;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--red-strong);font-weight:600}
.dropt{display:inline-flex;align-items:center;gap:6px;margin:6px 0 0 30px;font-size:12px;color:var(--gray)}
.dropt input{width:16px;height:16px;accent-color:var(--red)}
.drop{display:grid;grid-template-columns:24px 1fr 1fr 1fr 40px;gap:6px;align-items:center;margin-top:6px}
.drop span{grid-column:1/3;font-size:12px;color:var(--red-strong);font-weight:600;padding-left:30px}
.drop input{grid-column:auto}
.drop .sp{grid-column:auto}
.scale{width:100%;border-collapse:collapse;margin:8px 0}
.scale td{padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
.scale td:first-child{font-weight:600;width:46px;font-family:'Archivo';font-stretch:125%}
.scale tr.zone td{background:var(--red-tint)}
.term{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.term b{display:block;margin-bottom:4px;font-weight:600}
.term p{margin:0;font-size:13px;color:var(--gray);line-height:1.45}
.search{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:10px}
.cardio{padding:10px 0}
.cardio .lvl{font-family:'Archivo';font-stretch:125%;font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:18px}
.sheet-bg{position:fixed;inset:0;background:rgba(28,27,25,.45);display:none;z-index:20}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--bg);border-radius:18px 18px 0 0;padding:16px;max-height:82vh;overflow:auto;z-index:21;display:none}
.sheet.on{display:block}
.sheet h3{font-size:15px;margin-bottom:4px}
.sheet .sub{color:var(--gray);font-size:13px;margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);font-size:13px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.alt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:8px}
.alt b{font-weight:600}
.alt small{color:var(--gray);display:block;font-size:12px;margin-top:2px}
.alt.cur{border-color:var(--red);background:var(--red-tint)}
.video{aspect-ratio:16/9;background:var(--ink);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--bg);text-align:center;padding:14px;gap:8px}
.video small{color:#B9B3A8}
.video a{color:var(--bg);border:1px solid var(--bg);padding:8px 14px;border-radius:99px;text-decoration:none;font-size:13px}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;width:calc(100% - 32px);max-width:448px;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:none;align-items:center;justify-content:space-between;z-index:15}
.timer.on{display:flex}
.timer .t{font-family:'Archivo';font-stretch:125%;font-weight:600;font-size:22px;letter-spacing:.04em}
.timer button{background:transparent;border:1px solid var(--bg);color:var(--bg);border-radius:99px;padding:6px 12px;font-size:13px}
.foot{color:var(--gray);font-size:12px;text-align:center;margin-top:22px}
.app{padding-bottom:150px}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;background:none;border:0;padding:10px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;color:var(--gray)}
.tab svg{height:22px;width:auto}
.tab span{font-size:10px;letter-spacing:0;font-weight:500}
.tab.on{color:var(--ink)}
.tab.on span{font-weight:600}
.tab.on::before{content:'';position:absolute;top:-1px;left:22%;right:22%;height:3px;background:var(--c)}
.h2{font-size:14px;margin:18px 0 10px}
.segbar{display:flex;gap:5px;margin:4px 0 6px}
.segbar i{flex:1;height:6px;border-radius:99px}
.sub2{font-size:13px;color:var(--gray)}
.tcard{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:14px 14px 14px 0;border:1px solid var(--line);background:var(--card);border-radius:14px;margin-bottom:10px;overflow:hidden}
.tcard .bar{align-self:stretch;width:6px;background:var(--c);flex:none}
.tcard .tb{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.tcard small{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.tcard b{font-weight:600;font-size:16px}
.tcard em{font-style:normal;font-size:13px;color:var(--gray)}
.tcard .st{width:34px;height:34px;border-radius:99px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--gray);flex:none}
.tcard .st.ok{color:#fff}
.banner{border-left:4px solid;background:var(--card);border-radius:0 12px 12px 0;padding:12px 14px;margin:4px 0 12px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.banner .title{font-size:13px}
.banner p{margin:4px 0 0;font-size:14px;color:var(--gray);line-height:1.45}
.trow{display:flex;gap:12px;align-items:flex-start;padding:14px 12px;border:1px solid var(--line);background:var(--card);border-radius:12px;margin-bottom:8px}
.trow .chk{width:30px;height:30px;border-radius:8px;border:2px solid var(--c);background:var(--bg);color:#fff;font-size:16px;flex:none;display:flex;align-items:center;justify-content:center}
.trow.on .chk{background:var(--c)}
.trow .tx{display:flex;flex-direction:column;gap:2px;align-items:flex-start;min-width:0}
.trow b{font-weight:600}
.trow small{color:var(--gray);font-size:13px}
.trow .tt{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.trow .xp{margin-top:6px;padding:0;text-align:left;font-size:11px}
.trow .optdot{width:12px;height:12px;border-radius:99px;background:var(--c);flex:none;margin:9px 9px 0 9px}
.trow.on .tt b{text-decoration:line-through;color:var(--gray)}
.vbox{align-self:stretch;margin-top:8px}
.vph{aspect-ratio:16/9;background:var(--ink);color:var(--bg);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.vph b{font-size:22px;font-weight:600}
.vph small{color:#B9B3A8;font-size:12px}
.vbox p{font-size:13px;color:var(--gray);line-height:1.5;margin:10px 0 0}
.grp{font-family:'Archivo';font-stretch:125%;font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:12px;color:var(--gray);margin:14px 0 8px}
.xrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.xbtn{padding:6px 10px;border:1px solid var(--c);border-radius:99px;background:var(--bg);color:var(--c);font-size:12px;font-weight:500}
.xbtn.on{background:var(--c);color:#fff}
.cal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 6px 10px;margin:4px 0 12px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 4px}
.arr{width:36px;height:36px;border:0;background:none;font-size:22px;color:var(--gray)}
.pill.wk{font-weight:500;color:var(--ink)}
.caldays{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cd{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px 0}
.cd .dl{font-size:11px;color:var(--gray);font-weight:600}
.ring{position:relative;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:99px}
.ring svg:first-child{position:absolute;inset:0;width:100%;height:100%}
.ring b{position:relative;font-size:14px;font-weight:600}
.cd.tdy .ring b{color:var(--red)}
.cd.sel .ring{background:var(--ink)}
.cd.sel .ring b{color:var(--bg)}
.cd.sel .ring svg circle:first-child{stroke:#55504A}
.cd.sel .dl{color:var(--ink)}
.bdg{position:absolute;right:-4px;bottom:-3px;width:15px;height:15px;border-radius:99px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.bdg svg{width:9px;height:auto}
.lead{color:var(--gray);font-size:14px;line-height:1.5;margin:0 0 14px}
.pcard{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;padding:16px;border:1px solid var(--line);background:var(--card);border-radius:14px;margin-bottom:10px}
.pcard b{font-weight:600;font-size:16px}
.pcard small{color:var(--gray);font-size:13px}
.pcard.sm{padding:12px 14px;margin-bottom:8px}
.pcard.on{border-color:var(--red);background:var(--red-tint)}
.fld{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:6px}
.fl{display:block;font-size:13px;color:var(--gray);margin:10px 0 6px}
.obsec{margin-bottom:6px}
.dob{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:8px}
.hint{font-size:13px;color:var(--gray);margin:4px 0 4px}
.wcard{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--ink);border-radius:14px;padding:14px;margin-bottom:10px}
.wcard .wl{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.wcard .wl b{font-size:22px;font-weight:600;font-family:'Archivo';font-stretch:125%}
.wcard .wl em{font-style:normal;font-size:13px;color:var(--gray)}
.wr{display:flex;gap:8px}
.wr input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.wr .btn{flex:none;padding:11px 18px}
.big{padding:12px 2px}
.big small{display:block;color:var(--gray);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.big b{font-family:'Archivo';font-stretch:125%;font-size:34px;font-weight:600}
.big em{display:block;font-style:normal;color:var(--gray);font-size:13px}
.chart{width:100%;height:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:4px}
.empty{padding:22px;text-align:center;color:var(--gray);font-size:13px;background:var(--card);border:1px dashed var(--line);border-radius:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--gray);margin:8px 0}
.legend i{display:inline-block;width:12px;height:3px;margin-right:5px;vertical-align:middle}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stats small{display:block;font-size:10px;color:var(--gray);text-transform:uppercase;letter-spacing:.05em}
.stats b{font-size:17px;font-weight:600}
.wrow{display:grid;grid-template-columns:1fr auto 60px 28px;gap:8px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);font-size:14px}
.wrow em{font-style:normal;color:var(--gray);font-size:13px;text-align:right}
.wrow .x{background:none;border:0;color:var(--gray);font-size:18px}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.lt{display:flex;flex-direction:column;gap:2px;min-width:0}
.lt b{font-weight:600}
.lt small,.lt em{font-style:normal;font-size:12px;color:var(--gray)}
.zhead{display:flex;gap:12px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:8px}
.zhead .zbar{width:8px;background:var(--zc);flex:none}
.zhead>div{padding:10px 12px 10px 0;display:flex;flex-direction:column;gap:2px}
.zhead small{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--gray);font-weight:600}
.zhead b{font-weight:600;font-size:17px}
.zhead em{font-style:normal;font-size:13px;color:var(--gray)}
.zstrip{display:flex;gap:4px}
.zstrip span{flex:1;text-align:center;color:#fff;font-size:12px;font-weight:600;padding:5px 0;border-radius:6px;opacity:.45}
.zstrip span.cur{opacity:1;outline:2px solid var(--ink);outline-offset:1px}
.zd{display:inline-block;width:9px;height:9px;border-radius:99px;margin:0 5px 0 2px}
.zt{margin:12px 0}
.zr{display:flex;gap:12px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.zb{width:30px;height:30px;border-radius:8px;color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.zr>div{display:flex;flex-direction:column;gap:2px}
.zr b{font-weight:600;font-size:14px}
.zr small{font-size:12px;color:var(--gray);line-height:1.4}
.xrow2{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.xrow2 b{font-weight:600;display:block}
.xrow2 small{color:var(--gray);font-size:12px}
.xrow2 .x{background:none;border:0;font-size:18px;color:var(--gray)}
.wdial{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px 0 4px}
.step{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:13px}
.wnum{display:flex;flex-direction:column;align-items:center;min-width:92px}
.wnum b{font-family:'Archivo';font-stretch:125%;font-size:36px;font-weight:600}
.wnum small{color:var(--gray);font-size:12px;margin-top:-4px}
.wweek{display:flex;flex-direction:column;gap:6px;margin:6px 0 8px}
.wweek small{color:var(--gray);font-size:12px}
.dots{display:flex;gap:8px;justify-content:center}
.dots span{display:flex;flex-direction:column;align-items:center;gap:4px}
.dots small{font-size:10px;color:var(--gray)}
.dots i{width:18px;height:18px;border-radius:99px;border:2px solid var(--line);display:block}
.dots span.on i{background:var(--red);border-color:var(--red)}
.dots span.cur i{outline:2px solid var(--ink);outline-offset:2px}
.celeb{text-align:center;padding:6px 0 10px}
.okc{width:64px;height:64px;border-radius:99px;background:var(--red);color:#fff;font-size:32px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.18)}100%{transform:scale(1)}}
.wbigv{font-family:'Archivo';font-stretch:125%;font-size:30px;font-weight:600;margin:2px 0}
.streak{display:inline-block;margin:8px 0;padding:6px 14px;border-radius:99px;background:var(--red-tint);color:var(--red-strong);font-weight:600;font-size:13px;animation:pop .6s .2s both}

function ctxFor(date){
  const P=PERIOD[S.program], raw=Math.floor(diffD(monOf(date),S.start)/7)+1;
  let wk=1,mes=1; if(raw>=1){wk=((raw-1)%P.weeks)+1;mes=Math.floor((raw-1)/P.weeks)+1;}
  const sched=(S.user&&S.user.sched)||[0,2,4], pos=sched.indexOf(wdOf(date));
  return {raw,wk,mes,pos,d:(raw>=1&&pos>=0)?DAYS[pos%DAYS.length]:null};
}
function apply(date){S.sel=date;const c=ctxFor(date);S.week=c.wk;S.day=c.d?DAYS.indexOf(c.d):-1;S.pos=c.pos;S.raw=c.raw;S.mes=c.mes;return c;}
function withDate(date,fn){const o={sel:S.sel,week:S.week,day:S.day,pos:S.pos,raw:S.raw,mes:S.mes};apply(date);try{return fn();}finally{Object.assign(S,o);}}
function dayProgress(date){return withDate(date,()=>{
  const parts=[], c=ctxFor(date);
  if(c.d){const ts=trainStats();if(ts.total)parts.push(ts.done/ts.total);}
  ['recovery','habitos','alim'].forEach(p=>{const t=tcount(p);parts.push(t.done/t.total);});
  parts.push(S.weights[date]!=null?1:0);
  parts.push(Math.min(1,(S.steps[date]||0)/(S.stepGoal||8000)));
  return parts.length?parts.reduce((a,b)=>a+b,0)/parts.length:0;});}

const avgIn=(L,a,b)=>{const x=L.filter(p=>p.d>=a&&p.d<=b);return x.length?{avg:x.reduce((s,p)=>s+p.w,0)/x.length,n:x.length}:null;};
function weightStats(upTo){
  const L=wlist().filter(p=>p.d<=upTo); if(!L.length)return null;
  const cur=avgIn(L,addD(upTo,-6),upTo), pre=avgIn(L,addD(upTo,-13),addD(upTo,-7));
  const ok=cur&&pre&&cur.n>=2&&pre.n>=2;
  return {L,first:L[0],last:L[L.length-1],prev:L.length>1?L[L.length-2]:null,cur,pre,pct:ok?(cur.avg-pre.avg)/pre.avg*100:null,delta:ok?cur.avg-pre.avg:null};
}
function weightFeedback(st){
  const out=[]; if(!st)return out;
  if(!st.prev){out.push('Primer registro guardado. Con unos días más empezamos a ver tu tendencia.');return out;}
  const dd=st.last.w-st.prev.w;
  if(Math.abs(dd)>=2.5){out.push('Hay un cambio grande desde tu último registro. Revisa si te pesaste en condiciones distintas (hora, ropa, antes o después de comer) y cuéntaselo a tu coach. Mientras lo confirmamos, no sacamos conclusiones de este dato.');return out;}
  else if(Math.abs(dd)>=0.6) out.push(`Cambió ${dd>0?'+':''}${dd.toFixed(1)} kg respecto a tu último registro. Es normal: de un día a otro el peso sube y baja por agua, sal, comidas y digestión. Lo que importa es la tendencia.`);
  const g=S.goal, p=st.pct;
  if(p==null){out.push('Pésate al menos 2 veces por semana para ver tu tendencia semanal.');return out;}
  const d=`${st.delta>0?'+':''}${st.delta.toFixed(1)} kg`;
  if(g==='bajar'){
    if(p<-1) out.push(`Tu promedio semanal bajó ${d}: estás bajando más rápido de lo recomendable. Revisa que estés comiendo suficiente y que tu energía y rendimiento estén bien, y coméntalo con tu coach.`);
    else if(p<=-0.25) out.push(`Excelente: tu promedio semanal bajó ${d}. Es un ritmo sostenible y vas bien con tu alimentación. Sigamos así.`);
    else if(p<0.25) out.push('Tu peso está estable esta semana. Pasa, y no significa que no avances: mira la tendencia de 2 a 3 semanas, tus medidas y cómo te ves.');
    else out.push(`Tu promedio subió ${d}. Suele ser retención de líquidos, más sal o comidas más abundantes. No te alarmes: miramos la tendencia, no un día.`);
  } else if(g==='aumentar'){
    if(p<-0.25) out.push(`Tu promedio bajó ${d}. A veces es agua y glucógeno (menos carbohidratos, poco sueño o estrés) y se recupera fácil. Si se repite, puede que estés comiendo menos de lo necesario: cuéntaselo a tu coach.`);
    else if(p<0.2) out.push('Tu peso casi no se mueve. Si tu meta es subir, puede que necesites comer un poco más. Recuerda: comer limpio no es lo mismo que comer suficiente.');
    else if(p<=0.6) out.push(`Excelente: tu promedio semanal subió ${d}. Es un buen ritmo y significa que vas bien con tu alimentación. Sigamos así.`);
    else out.push(`Tu promedio subió ${d}, algo rápido. Parte puede ser grasa extra: revisa porciones con tu coach.`);
  } else {
    if(Math.abs(p)<=0.5) out.push('Peso estable: justo lo que buscamos para mantener y recomponer. Fíjate también en tu fuerza, tus medidas y cómo te sientes.');
    else if(p>0.5) out.push(`Tu promedio subió ${d}. Puede ser agua o comidas más abundantes; miramos la tendencia de las próximas semanas.`);
    else out.push(`Tu promedio bajó ${d}. Si no es lo que buscas, revisa que estés comiendo suficiente.`);
  }
  return out;
}
const fshort=x=>pd(x).toLocaleDateString('es-CO',{day:'numeric',month:'short'});
function lineChart(L){
  if(L.length<2) return `<div class="empty">Registra tu peso en 2 días distintos para ver la gráfica.</div>`;
  const w=320,h=160,span=Math.max(1,diffD(L[L.length-1].d,L[0].d)), ys=L.map(p=>p.w), mn=Math.min(...ys), mx=Math.max(...ys), pad=(mx-mn)*0.25||1, lo=mn-pad, hi=mx+pad;
  const X=d=>34+(diffD(d,L[0].d)/span)*(w-46), Y=v=>10+(1-(v-lo)/(hi-lo))*(h-38);
  const tr=L.map(p=>{const a=avgIn(L,addD(p.d,-6),p.d);return [X(p.d),Y(a.avg)];});
  const grid=[hi-pad*0.2,(lo+hi)/2,lo+pad*0.2].map(v=>`<line x1="34" x2="${w-8}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="30" y="${(Y(v)+3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--gray)">${v.toFixed(1)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}">${grid}<polyline fill="none" stroke="#C0392B" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${tr.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"/>${L.map(p=>`<circle cx="${X(p.d).toFixed(1)}" cy="${Y(p.w).toFixed(1)}" r="3" fill="var(--gray)" opacity=".55"/>`).join('')}<text x="34" y="${h-8}" font-size="9" fill="var(--gray)">${fshort(L[0].d)}</text><text x="${w-8}" y="${h-8}" font-size="9" text-anchor="end" fill="var(--gray)">${fshort(L[L.length-1].d)}</text></svg>`;
}
function spark(vals){
  if(vals.length<2) return '';
  const w=90,h=30,mn=Math.min(...vals),mx=Math.max(...vals),r=(mx-mn)||1;
  const pts=vals.map((v,i)=>`${(2+i/(vals.length-1)*(w-4)).toFixed(1)},${(h-3-((v-mn)/r)*(h-8)).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><polyline fill="none" stroke="#C0392B" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts}"/></svg>`;
}
function loggedLifts(){
  const map={};
  Object.keys(S.logs).forEach(k=>{
    const [date,did,bk,ii]=k.split('|'), d=DAYS.find(x=>x.id===did); if(!d)return;
    const sets=(S.logs[k]||[]).filter(x=>x&&x.done&&x.kg>0); if(!sets.length)return;
    withDate(date,()=>{
      const b=d.blocks.find(x=>x.k===bk); if(!b||!b.items)return;
      const it=itemsOf(d,b)[+ii]; if(!it)return;
      const ex=curEx(d,bk,+ii,it), best=sets.reduce((a,s)=>(s.kg>a.kg||(s.kg===a.kg&&(s.reps||0)>(a.reps||0)))?s:a,sets[0]);
      (map[ex]=map[ex]||[]).push({date,kg:best.kg,reps:best.reps||0});
    });
  });
  Object.values(map).forEach(a=>a.sort((x,y)=>x.date<y.date?-1:1));
  return map;
}

const LEVELS=[[0,'Arranque'],[150,'Constancia'],[450,'Hábito'],[900,'Disciplina'],[1500,'Dominio'],[2400,'Élite']];
const trained=d=>withDate(d,()=>{if(!ctxFor(d).d)return false;const ts=trainStats();return ts.total>0&&ts.done/ts.total>=0.7;});
function gam(){
  const t=today(), from=(S.start&&S.start>addD(t,-180))?S.start:addD(t,-180);
  let xp=0,best=0,cur=0,nT=0,okDays=0,stepsOk=0;
  for(let d=from;d<=t;d=addD(d,1)){
    const pr=dayProgress(d), tr=trained(d);
    if(tr)nT++;
    xp+=Math.round(pr*20)+(tr?10:0);
    if(pr>=0.5){cur++;okDays++;best=Math.max(best,cur);}else if(d!==t){cur=0;}
    if((S.steps[d]||0)>=S.stepGoal)stepsOk++;
  }
  let li=0;LEVELS.forEach((l,i)=>{if(xp>=l[0])li=i;});
  const nx=LEVELS[li+1]||null, mon=monOf(t); let wp=0,wt=0;
  for(let i=0;i<7;i++){const d=addD(mon,i);if(ctxFor(d).d){wp++;if(d<=t&&trained(d))wt++;}}
  return {xp,li,name:LEVELS[li][1],nx,streak:cur,best,nT,okDays,stepsOk,wp,wt};
}

  } else { const u=S.user, rowsH=(a,b)=>`<div class="note"><b>${a}</b> ${b}</div>`;
    h=`<h2 class="h2" style="margin-top:8px">Listo, ${u.name}</h2><p class="lead">Este es tu plan:</p>`+
     (u.plan==='basic'?rowsH('Programa Basic','· Nivel '+u.level+' · Bloque 1')+rowsH(u.days+' días por semana','· '+u.sched.map(i=>DNL[i]).join(' · '))+rowsH('Mesociclo de 5 semanas','con progresión automática')+((u.extra&&u.extra.length)?rowsH('Descanso activo','· '+u.extra.map(i=>DNL[i]).join(' · ')+': camina, movilidad y respiración. En Basic el máximo es de 5 días de fuerza; si quieres un plan a tu medida, existe Complete.'):'')+rowsH('Objetivo:',goalsTxt(u))
       :rowsH('Programa Complete','· Coaching 1:1')+rowsH('Tu coach revisa tu información','y diseña tu mesociclo de 6 semanas a tu medida.')+rowsH('Llamada de bienvenida','con tu coach para arrancar.')+rowsH(u.days+' días por semana','· '+u.sched.map(i=>DNL[i]).join(' · '))+rowsH('Objetivo:',goalsTxt(u))+`<p class="lead" style="font-size:13px">Para esta prueba ya te dejamos un programa de ejemplo.</p>`)+
     (u.pain==='Sí'?`<div class="note" style="background:var(--red-tint);color:var(--red-strong)">Anotamos tus molestias${u.painTxt?': '+u.painTxt:''}. Tu coach las revisa antes de asignarte ejercicios.</div>`:'')+
     `<button class="btn solid" data-act="obenter" style="width:100%;margin-top:14px;padding:14px">Entrar a la app</button>`; }
  $('#app').innerHTML=head+h;
}
function obSubmit(){
  const o=S.ob,f=o.form,full=o.type==='full';
  if(!(f.name||'').trim()){o.err='Escribe tu nombre.';return false;}
  if(!f.sex){o.err='Elige tu sexo.';return false;}
  if(f.dd||f.mm||f.yy){const dd=+f.dd,mm=+f.mm,yy=+f.yy,t=new Date(yy,mm-1,dd);
    if(!(dd&&mm&&yy)||t.getDate()!==dd||t.getMonth()!==mm-1||t.getFullYear()!==yy||yy<1920||yy>new Date().getFullYear()-10){o.err='Revisa tu fecha de nacimiento (dd/mm/aaaa).';return false;}}
  const goals=(f.goals&&f.goals.length)?f.goals:['complete'], main=goals.includes(f.main)?f.main:goals[0];
  let sched,days;
  if(full){sched=(f.wd||[]).slice().sort((a,b)=>a-b);days=sched.length;if(days<1){o.err='Elige al menos un día para entrenar.';return false;}}
  else{sched=(f.wd||[]).slice().sort((a,b)=>a-b);days=sched.length;if(days<1){o.err='Elige al menos un día para entrenar.';return false;}}
  o.err='';
  let extra=[];if(o.plan==='basic'&&sched.length>5){extra=sched.slice(5);sched=sched.slice(0,5);}
  S.user={plan:o.plan,type:o.type,name:f.name.trim(),sex:f.sex,goals,main,goal:main,level:f.level||'Principiante',days:sched.length,sched,extra,pain:f.pain||'No',painTxt:f.painTxt||'',data:f};
  S.program=o.plan;S.goal=GOALKEY[main];S.start=monOf(today());S.off=0;S.sel=today();S.tab='inicio';
  S.logs={};S.swaps={};S.extras={};S.cardio={};S.tasks={};S.exp={};S.weights={};S.fb={};S.chat=[];S.chatRead=0;S.sum={};
  o.step='done';return true;
}

function toast(m){let e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';document.body.appendChild(e);}e.textContent=m;e.className='';void e.offsetWidth;e.className='on';clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2300);}
function sheet(html){ $('#sheet').innerHTML=html; $('#sheet').classList.add('on'); $('#bg').classList.add('on'); }
function closeSheet(){ $('#sheet').classList.remove('on'); $('#bg').classList.remove('on'); }

function openSwap(){
  const d=DAYS[S.day], b=d.blocks.find(x=>x.k===swapCtx.b), it=b.items[swapCtx.i];
  const cur=curEx(d,swapCtx.b,swapCtx.i,it), x=E[cur];
  const inDay=new Set(); d.blocks.forEach(bb=>bb.items&&bb.items.forEach((q,j)=>{ if(!(bb.k===swapCtx.b&&j===swapCtx.i)) inDay.add(curEx(d,bb.k,j,q)); }));
  const pool=Object.entries(E).filter(([id,e])=>e.pat===x.pat&&!inDay.has(id));
  const eqs=['Todos',...new Set(pool.map(([,e])=>e.eq))];
  const list=pool.filter(([,e])=>eqFilter==='Todos'||e.eq===eqFilter).sort((a,b)=>a[1].lvl-b[1].lvl);
  sheet(`<h3>Cambiar ejercicio</h3>
    <div class="sub">Mismo patrón: <b>${x.pat}</b> · ${x.mus}. Mantienes series, reps y RIR.</div>
    <div class="chips">${eqs.map(q=>`<button class="chip${eqFilter===q?' on':''}" data-act="eq" data-v="${q}">${q}</button>`).join('')}</div>
    ${list.map(([id,e])=>`<button class="alt${id===cur?' cur':''}" data-act="pick" data-ex="${id}"><span><b>${e.n}</b><small>${e.eq} · ${['','Sencillo','Intermedio','Avanzado'][e.lvl]}${id===it.ex?(isC()?' · Original del coach':' · Original'):''}</small></span><span>${id===cur?'Actual':'Elegir'}</span></button>`).join('')||'<div class="sub">No hay alternativas con ese equipo.</div>'}
    <button class="btn" data-act="close" style="width:100%;margin-top:4px">Cerrar</button>`);
}
/* ---------- añadir ejercicio extra ---------- */
let addCtx=null, addCat='Fuerza', addQ='';
const CATS={Calentamiento:['Movilidad torácica','Activación escapular','Movilidad de cadera'],Estiramiento:['Estiramiento','Respiración']};
const catOf=e=>CATS.Calentamiento.includes(e.pat)?'Calentamiento':CATS.Estiramiento.includes(e.pat)?'Estiramiento':'Fuerza';
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function addList(){
  const l=Object.entries(E).filter(([,e])=>catOf(e)===addCat&&(!addQ||norm(e.n+' '+e.mus+' '+e.eq).includes(norm(addQ)))).sort((a,b)=>a[1].pat.localeCompare(b[1].pat));
  return l.map(([id,e])=>`<button class="alt" data-act="addpick" data-ex="${id}"><span><b>${e.n}</b><small>${e.pat} · ${e.mus} · ${e.eq}</small></span><span>Añadir</span></button>`).join('')||'<div class="sub">Sin resultados.</div>';
}
function openAdd(){
  sheet(`<h3>Añadir ejercicio</h3><div class="sub">Suma un extra a este bloque: calentamiento, fuerza o estiramiento. Registras peso y reps igual que los demás.</div>
   <div class="chips">${['Calentamiento','Fuerza','Estiramiento'].map(c=>`<button class="chip${addCat===c?' on':''}" data-act="addcat" data-v="${c}">${c}</button>`).join('')}</div>
   <input id="addq" class="search" type="search" placeholder="Buscar ejercicio, músculo o equipo" value="${addQ}">
   <div id="addl">${addList()}</div>
   <button class="btn" data-act="close" style="width:100%;margin-top:4px">Cerrar</button>`);
}

/* ---------- glosario ---------- */
const RPE_ROWS=[['10','Fallo total. No podías hacer ni una repetición más.',0],['9','Te quedaba 1 repetición en reserva.',0],['8','Te quedaban 2 repeticiones. Duro, pero controlado.',1],['7','Te quedaban 3 repeticiones. Esfuerzo sólido.',1],['6','Te quedaban 4 repeticiones. Moderado, técnica limpia.',1],['5','Te quedaban 5 o más. Es más bien calentamiento.',0],['1-4','Muy fácil o ligero. Casi sin esfuerzo.',0]];
const rpeTable=()=>`<table class="scale">${RPE_ROWS.map(r=>`<tr class="${r[2]?'zone':''}"><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`;
const INFO={
 series:{t:'Series',b:'<p>Una serie es un grupo de repeticiones seguidas, sin parar. La completas cuando llegas al rango de repeticiones que te indica el ejercicio. Después descansas y haces la siguiente.</p>'},
 reps:{t:'Reps (repeticiones)',b:'<p>Es la cantidad de veces que haces el movimiento dentro de una serie. Un rango como 6-10 significa que debes hacer entre 6 y 10 repeticiones con buena técnica. Si te quedas en 6, perfecto. Si llegas a 10 con facilidad, es señal de que puedes subir el peso (tu coach te dirá cuándo).</p>'},
 rir:{t:'RIR (repeticiones en reserva)',b:'<p>Son las repeticiones que te habrían quedado antes de llegar al fallo. RIR 2 significa que al terminar la serie aún podías hacer 2 más. RIR 0 es llegar al fallo. Es la otra cara del RPE: RPE 8 equivale a RIR 2.</p>'},
 descanso:{t:'Descanso',b:'<p>Es el tiempo que esperas entre una serie y la siguiente. Los ejercicios básicos llevan más descanso porque mueves más peso y necesitas recuperarte para rendir en la siguiente serie. En los accesorios es más corto. Al marcar una serie, la app arranca el temporizador sola.</p>'},
 tempo:{t:'Tempo',b:'<p>Son 4 números que marcan la velocidad del movimiento, en segundos: bajada (excéntrica), pausa abajo, subida y pausa arriba.</p><p style="margin-top:8px"><b style="display:inline">Ejemplo 3-0-1-0:</b> bajas en 3 segundos, sin pausa abajo, subes en 1 segundo y sin pausa arriba. Controlar la bajada hace que el músculo trabaje más y que la técnica sea más limpia.</p>'},
 rpe:{t:'RPE (percepción del esfuerzo)',b:'<p>Es qué tan duro sentiste la serie, en una escala de 1 a 10. Anótalo al terminar cada serie. <b style="display:inline">En ERRE nos movemos entre RPE 6 y 8:</b> esfuerzo real, sin llegar siempre al fallo.</p>'+'RPE_TABLE'},
 dropset:{t:'Dropset',b:'<p>Al terminar tu serie, bajas el peso y sigues haciendo repeticiones sin descansar, hasta cansarte de nuevo. Úsalo cuando tu coach lo indique o lo hayas hecho tú. Marca la casilla "Dropset" en esa serie y anota el peso y las reps que hiciste después de bajar.</p>'}
};
function openInfo(v){
  const one=k=>{const x=INFO[k];return `<div class="term"><b>${x.t}</b>${x.b.replace('RPE_TABLE',rpeTable())}</div>`;};
  if(v==='all') sheet(`<h3>Glosario</h3><div class="sub">Qué significa cada cosa de tu rutina.</div>${['series','reps','rir','rpe','descanso','tempo','dropset'].map(one).join('')}<button class="btn" data-act="close" style="width:100%">Cerrar</button>`);
  else sheet(`<h3>${INFO[v].t}</h3><div style="height:6px"></div>${INFO[v].b.replace('RPE_TABLE',rpeTable())}<button class="btn" data-act="close" style="width:100%;margin-top:10px">Entendido</button>`);
}
function openVideo(id){
  const x=E[id], q=encodeURIComponent('ERRE Academy '+x.n+' técnica');
  sheet(`<h3>${x.n}</h3><div class="sub">${x.pat} · ${x.eq}</div>
    <div class="video"><b style="font-size:15px">Video técnico</b><small>En la app real, aquí se reproduce el video de tu canal de YouTube (embebido, sin salir de la app).</small><a href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">Buscar en YouTube</a></div>
    <button class="btn" data-act="close" style="width:100%;margin-top:12px">Cerrar</button>`);
}

/* ---------- respiración guiada ---------- */
const BP={
 man:{n:'Respiración 5-5',ph:[['Inhala',5,1],['Exhala',5,0]],min:2,tip:'Inhala por la nariz y exhala suave. Sin forzar.'},
 dor:{n:'Antes de dormir',ph:[['Inhala',4,1],['Exhala',6,0]],min:3,tip:'La exhalación más larga que la inhalación calma el cuerpo.'},
 ent:{n:'Vuelta a la calma',ph:[['Inhala',4,1],['Exhala',6,0]],min:2,tip:'Deja que el cuerpo baje de revoluciones.'},
 com:{n:'Asentar la comida',ph:[['Inhala',4,1],['Exhala',6,0]],min:2,tip:'Sentado, relajado, respiración suave y lenta.'},
 sigh:{n:'Suspiro fisiológico',ph:[['Inhala',2,.7],['Inhala otra vez',1,1],['Exhala largo',6,0]],min:1,tip:'Dos inhalaciones cortas por la nariz y una exhalación larga.'},
 caja:{n:'Respiración en caja',ph:[['Inhala',4,1],['Sostén',4,1],['Exhala',4,0],['Sostén',4,0]],min:2,tip:'Ritmo constante: 4 segundos cada fase.'},
 '478':{n:'Respiración 4-7-8',ph:[['Inhala',4,1],['Sostén',7,1],['Exhala',8,0]],min:2,tip:'Inhala por la nariz, sostén y exhala por la boca.'}
};
let BR=null;
const mmss=x=>{x=Math.max(0,Math.ceil(x));return Math.floor(x/60)+':'+String(x%60).padStart(2,'0');};
function breathEl(){let e=document.getElementById('bre');if(!e){e=document.createElement('div');e.id='bre';document.body.appendChild(e);}return e;}
function openBreath(id){const P=BP[id];if(!P)return;BR={id,P,dur:P.min*60,st:'ready',el:0,pi:0,pe:0,t:null};drawBreath();}
function drawBreath(){
  const e=breathEl(),B=BR;e.classList.add('on');
  const close=`<button class="bx" data-act="bclose" aria-label="Cerrar">×</button>`;
  if(B.st==='ready'){e.innerHTML=close+`<h2 class="h2" style="margin-top:4px">${B.P.n}</h2><div class="sub2" style="text-align:center">${B.P.tip}</div>
   <div class="brwrap"><div class="brc" style="transform:scale(.8)"><b>Listo</b></div></div>
   <div class="fbq" style="margin:0">Duración</div><div class="chips" style="justify-content:center;margin-top:8px">${[1,2,3,5].map(m=>`<button class="chip${B.dur===m*60?' on':''}" data-act="bdur" data-v="${m}">${m} min</button>`).join('')}</div>
   <button class="btn solid" data-act="bgo" style="width:100%;max-width:340px;margin-top:20px;padding:14px">Comenzar</button>`;return;}
  if(B.st==='done'){e.innerHTML=close+`<div class="celeb" style="margin-top:60px"><div class="okc">✓</div><h3>Respiración completa</h3><div class="sub">${B.P.n} · ${Math.round(B.dur/60)} min. Notas cómo baja el ritmo, ¿verdad?</div></div>
   <button class="btn solid" data-act="bclose" style="width:100%;max-width:340px;margin-top:20px;padding:14px">Listo</button>`;return;}
  e.innerHTML=close+`<h2 class="h2" style="margin-top:4px">${B.P.n}</h2><div class="sub2" style="text-align:center">Quedan <span id="brt">${mmss(B.dur-B.el)}</span></div>
   <div class="brwrap"><div class="brc" id="brc"><b id="brl"></b><span id="brs"></span></div></div>
   <button class="btn" data-act="bpause" style="width:100%;max-width:340px;margin-top:20px;padding:14px">${B.st==='pause'?'Continuar':'Pausar'}</button>`;
  if(B.st==='run')setPhase(true);
}
function setPhase(init){
  const B=BR,ph=B.P.ph[B.pi],c=document.getElementById('brc');if(!c)return;
  document.getElementById('brl').textContent=ph[0];
  const rem=Math.max(0,ph[1]-B.pe);document.getElementById('brs').textContent=Math.ceil(rem)||'';
  const sc=.55+.45*ph[2];
  if(init&&B.pe===0&&B.el===0){c.style.transition='none';c.style.transform=`scale(${.55+.45*(B.P.ph[B.P.ph.length-1][2])})`;void c.offsetWidth;}
  c.style.transition=`transform ${rem}s ease-in-out`;c.style.transform=`scale(${sc})`;
}
function breathTick(){
  const B=BR;if(!B||B.st!=='run')return;
  B.el+=.1;B.pe+=.1;
  if(B.el>=B.dur){clearInterval(B.t);B.st='done';const k='recovery.'+B.id,o=tk();if(['man','dor'].includes(B.id)&&!o[k]){o[k]=true;save();render();toast('Respiración del día completada ✓');}drawBreath();return;}
  const ph=B.P.ph[B.pi];
  if(B.pe>=ph[1]-.001){B.pi=(B.pi+1)%B.P.ph.length;B.pe=0;setPhase();}
  else{const s=document.getElementById('brs');if(s)s.textContent=Math.ceil(ph[1]-B.pe);}
  const t=document.getElementById('brt');if(t)t.textContent=mmss(B.dur-B.el);
}
function breathClose(){if(BR&&BR.t)clearInterval(BR.t);BR=null;const e=document.getElementById('bre');if(e){e.classList.remove('on');e.innerHTML='';}}

/* ---------- temporizador de descanso ---------- */
/* Se calcula con la HORA DE FIN (no restando cada segundo): si la app queda en segundo plano o el celular la duerme, al volver el tiempo sigue exacto. Se guarda para sobrevivir a una recarga. */
let tInt=null,tLeft=0,tEnd=0;
function restBeep(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=new A(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.12;o.connect(g);g.connect(c.destination);o.start();setTimeout(()=>{try{o.stop();c.close();}catch(e){}},350);}catch(e){}}
function startTimer(s){stopTimer();tEnd=Date.now()+s*1000;try{localStorage.setItem('erre_rest_end',String(tEnd));}catch(e){}$('#timer').classList.add('on');tick();tInt=setInterval(tick,250);}
function tick(){if(!tEnd)return;const ms=tEnd-Date.now();tLeft=Math.max(0,Math.ceil(ms/1000));const m=Math.floor(tLeft/60),s=tLeft%60;$('#tt').textContent=m+':'+String(s).padStart(2,'0');
  if(ms<=0){const late=-ms>4000;stopTimer();try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}if(late){try{toast('Descanso listo ✓');}catch(e){}}else restBeep();}}
function stopTimer(){clearInterval(tInt);tInt=null;tEnd=0;try{localStorage.removeItem('erre_rest_end');}catch(e){}$('#timer').classList.remove('on');}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&tEnd)tick();});
window.addEventListener('pageshow',()=>{if(tEnd)tick();});
window.addEventListener('focus',()=>{if(tEnd)tick();});
try{const e0=+localStorage.getItem('erre_rest_end');if(e0>Date.now()){tEnd=e0;$('#timer').classList.add('on');tick();tInt=setInterval(tick,250);}else if(e0)localStorage.removeItem('erre_rest_end');}catch(e){}
$('#skip').addEventListener('click',stopTimer);

render();
</script>
